name: Release DMG

# Builds, signs (Developer ID), notarizes and staples a .dmg, then attaches it
# to a GitHub Release. Reuses scripts/make_dmg.sh as the source of truth.
#
# Trigger: push a tag like v1.0.0, or run manually (Actions ▸ Run workflow).
#
# Required repository secrets (Settings ▸ Secrets and variables ▸ Actions):
#   MACOS_CERTIFICATE_P12          base64 of the "Developer ID Application" .p12
#                                  (base64 -i cert.p12 | pbcopy)
#   MACOS_CERTIFICATE_PASSWORD     password used when exporting that .p12
#   KEYCHAIN_PASSWORD              any string — password for the temp keychain
#   DEVDISK_SIGN_IDENTITY          e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID                       Apple ID email used for notarization
#   APPLE_TEAM_ID                  10-char Apple Developer Team ID
#   APPLE_APP_SPECIFIC_PASSWORD    app-specific password for that Apple ID
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # needed to create the Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Cheap gate on Ubuntu — the expensive signed build only runs if this passes.
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test

  build-dmg:
    needs: analyze-test
    runs-on: macos-latest
    env:
      DEVDISK_SIGN_IDENTITY: ${{ secrets.DEVDISK_SIGN_IDENTITY }}
      DEVDISK_NOTARY_PROFILE: devdisk-notary
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      # On a v* tag, use it as the version name (X.Y.Z); the Actions run number
      # becomes the build number (CFBundleVersion). make_dmg.sh reads both.
      - name: Derive app version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            NAME="${GITHUB_REF#refs/tags/}"
            echo "DEVDISK_BUILD_NAME=${NAME#v}" >> "$GITHUB_ENV"
          fi
          echo "DEVDISK_BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      # Import the Developer ID cert into a throwaway keychain and make it the
      # default so codesign and notarytool both find it.
      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/devdisk.keychain-db"
          CERT="$RUNNER_TEMP/cert.p12"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm -f "$CERT"

      # Store the notarytool profile (name matches DEVDISK_NOTARY_PROFILE) in the
      # same keychain so make_dmg.sh's `notarytool submit --keychain-profile` works.
      - name: Store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "$DEVDISK_NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --keychain "$RUNNER_TEMP/devdisk.keychain-db"

      - name: Build · sign · notarize · staple DMG
        run: ./scripts/make_dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevDisk-Cleaner-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Attach DMG to the Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
